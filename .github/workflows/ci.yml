name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/meeseek ./cmd/meeseek-box
